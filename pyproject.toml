[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cg-code-graph"
dynamic = ["version"]
description = "cg: a code graph of routes, calls, data access and platform boundaries for agents and humans (CLI + MCP server)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cyberchronos00" }]
dependencies = [
    "mcp>=2.2",
    "pyyaml>=6",
    "protobuf>=4.21",
    "tree-sitter>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-kotlin>=1.0",
    "tree-sitter-java>=0.23",
    "tree-sitter-swift>=0.6,<0.7.4",   # 0.7.4 (2026-10-04) changes the parse of two recovered shapes (#133)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
watch = ["watchfiles>=0.21"]

[project.scripts]
cg = "cg_code_graph.cli:main"
cg-mcp = "cg_code_graph.mcp_server:main"

[project.urls]
Homepage = "https://github.com/cyberchronos00/code-graph"
Changelog = "https://github.com/cyberchronos00/code-graph/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "cg_code_graph.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cg_code_graph*"]
# extractor dependencies are installed per user (cg_code_graph/core/extractors.py), never shipped
exclude = ["*.node_modules*", "cg_code_graph.plugins.php.extractor.vendor*", "*.dart_tool*", "*.screenshots*"]
