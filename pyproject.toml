[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cg-code-graph"
dynamic = ["version"]
description = "cg: a code graph of routes, calls, data access and platform boundaries for agents and humans (CLI + MCP server)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "cyberchronos00" }]
dependencies = [
    "mcp>=2.2",
    "pyyaml>=6",
    "protobuf>=4.21",
    "tree-sitter>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-kotlin>=1.0",
    "tree-sitter-swift>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cg = "codegraph.cli:main"
cg-mcp = "codegraph.mcp_server:main"

[project.urls]
Homepage = "https://github.com/cyberchronos00/code-graph"
Changelog = "https://github.com/cyberchronos00/code-graph/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "codegraph.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["codegraph*"]
# extractor dependencies are installed per user (codegraph/core/extractors.py), never shipped
exclude = ["*.node_modules*", "codegraph.plugins.php.extractor.vendor*", "*.dart_tool*", "*.screenshots*"]
