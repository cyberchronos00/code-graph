name: kotlin
kind: language
docs: docs/kotlin.md
# Gradle build output (KSP / kapt sources under build/generated), Gradle and IDE state, Kotlin/Native and JS caches
skip_dirs: [build, .gradle, .idea, .kotlin, .cxx, .externalNativeBuild, node_modules]
auth:
  guards:
    - {name: authenticate, source: "Ktor authenticate(\"name\") { } blocks, https://ktor.io/docs/server-auth.html"}
    # Spring method security and SecurityFilterChain guards live in presets/spring.yaml (the spring preset).
