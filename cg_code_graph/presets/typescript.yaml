name: typescript
kind: language
docs: https://www.typescriptlang.org/tsconfig#exclude
# not hashed into the extractor facts cache key (build output, tool caches, test reports)
skip_dirs: [.output, dist, .cache, coverage, playwright-report, test-results]
# the test-file walk (tests/, e2e/, ... and spec files in the source dirs) also skips build output, fixtures and snapshots
test_walk_skip_dirs: [build, fixtures, __fixtures__, __snapshots__]
# files the tsconfig pulls in from these directories are resolution input (dependency types, Nuxt's generated
# auto-import types), never project source
source_skip_dirs: [node_modules, .nuxt]
# build output of the JS frameworks cg models (Next.js .next, Nuxt .nuxt / .output, SvelteKit, Turborepo, Vercel,
# Storybook); never application source for the Nest / Next.js / Express plugins
build_dirs: [.next, .nuxt, .output, .svelte-kit, .turbo, .vercel, dist, build, out, coverage, storybook-static]
