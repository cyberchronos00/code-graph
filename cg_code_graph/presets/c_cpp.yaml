name: c_cpp
kind: language
docs: docs/native.md
# version-control state, vendored third-party trees and test frameworks, CMake / Bazel build output, caches
# (CG_EXCLUDE_DIRS / CG_INCLUDE_DIRS adjust this list for C / C++; .cg.yaml skip_dirs for every language)
skip_dirs: [.hg, .svn, target, third_party, thirdparty, third-party, 3rdparty, googletest, gtest, gmock, catch2,
            doctest, vendor, external, extern, deps, _deps, .cache, CMakeFiles, bazel-out, .venv]
# build trees by name prefix (build-release/, cmake-build-debug/); a directory holding CMakeCache.txt is skipped too
skip_dir_prefixes: [build, cmake-build]
